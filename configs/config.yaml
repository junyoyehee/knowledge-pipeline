# =========================================================
# 지식축적형 학습 파이프라인 설정
# CPT (Continued Pretraining) → SFT (Supervised Fine-Tuning)
# =========================================================

# ---------- 베이스 모델 ----------
model:
  # unsloth가 지원하는 아무 모델이나 지정 가능. 예시:
  #   unsloth/Qwen2.5-7B-Instruct-bnb-4bit
  #   unsloth/Llama-3.1-8B-Instruct-bnb-4bit
  #   unsloth/mistral-7b-instruct-v0.3-bnb-4bit
  #   LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct  (unsloth 미리 양자화 버전 없어도 load_in_4bit로 동작)
  name: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"
  max_seq_length: 4096          # VRAM에 맞춰 조정 (24GB → 4096 권장, 부족하면 2048)
  load_in_4bit: true            # 24GB 이하 GPU면 반드시 true (QLoRA)
  dtype: null                   # null이면 자동 감지 (bf16 지원 시 bf16)

  # SFT 단계에서 사용할 채팅 템플릿 (unsloth chat_template 이름)
  # qwen-2.5 / llama-3.1 / chatml / mistral 등
  chat_template: "qwen-2.5"

# ---------- 데이터 경로 ----------
data:
  raw_dir: "data/raw"                          # 원문 문서 (.txt / .md)
  cpt_dataset: "data/processed/cpt_dataset.jsonl"   # CPT용 (text 필드)
  sft_dataset: "data/processed/sft_dataset.jsonl"   # SFT용 (messages 필드, OpenAI 형식)
  # 툴 호출(function calling) 학습용 (선택) — 자세한 내용은 docs/tool_calling.md
  tool_dataset: "data/processed/tool_dataset.jsonl" # {messages, tools} 형식
  # 계획수립(planning) 학습용 (선택) — 자세한 내용은 docs/planning.md
  plan_dataset: "data/processed/plan_dataset.jsonl" # 목표 → 단계별 계획 (messages)
  # 선호 학습용 (선택) — generate_preference.py로 생성. 자세한 내용은 docs/preference_tuning.md
  pref_dataset: "data/processed/pref_dataset.jsonl" # DPO/ORPO 공용 (prompt/chosen/rejected)
  kto_dataset: "data/processed/kto_dataset.jsonl"   # KTO 전용 (prompt/completion/label)
  # 원문을 청크로 자를 때 설정
  chunk_size: 2000              # 문자 수 기준 청크 크기
  chunk_overlap: 200            # 청크 간 겹침 (문맥 유지)

# ---------- CPT (지식 주입 단계) ----------
cpt:
  output_dir: "outputs/cpt"
  # 지식 주입에는 embed_tokens / lm_head 학습이 중요 (unsloth CPT 권장 설정)
  lora:
    r: 128                      # CPT는 SFT보다 높은 rank 권장 (지식 수용량)
    alpha: 32
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - embed_tokens             # 새 도메인 어휘/지식 흡수에 필수
      - lm_head
  train:
    num_epochs: 3               # 지식축적은 여러 epoch 반복이 효과적
    per_device_batch_size: 2
    gradient_accumulation_steps: 8    # 실효 배치 16
    learning_rate: 5.0e-5
    embedding_learning_rate: 1.0e-5   # embed/lm_head는 10분의 1 수준으로 낮게
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    weight_decay: 0.01
    logging_steps: 5
    save_steps: 100
    seed: 42

# ---------- SFT (지식 활용 단계) ----------
sft:
  output_dir: "outputs/sft"
  # CPT 어댑터를 이어받아 학습. false면 베이스 모델에서 새로 시작
  continue_from_cpt: true
  # 데이터에 system 메시지가 없을 때 자동으로 앞에 붙일 기본 system 프롬프트.
  # null이면 붙이지 않음. 데이터에 이미 system이 있으면 그쪽이 우선.
  # 추론 시에도 같은 값을 쓰는 것이 중요 (test_model.py가 자동으로 사용)
  system_prompt: null
  lora:
    r: 32
    alpha: 32
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  train:
    num_epochs: 2
    per_device_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    warmup_ratio: 0.05
    lr_scheduler_type: "linear"
    weight_decay: 0.01
    logging_steps: 5
    save_steps: 100
    seed: 42
    # 응답 부분만 loss 계산 (질문 부분은 마스킹)
    train_on_responses_only: true

# =========================================================
# 툴 호출 학습 (선택 단계) — 반드시 docs/tool_calling.md를 먼저 읽으세요
# function calling(도구 사용) 능력을 별도로 주입하는 전용 단계입니다.
# 데이터 형식: {"messages": [...tool_calls/tool...], "tools": "<함수 스키마 JSON>"}
# =========================================================
tool:
  output_dir: "outputs/tool"
  # 어디서 시작할지: "sft"(기본) / "cpt" / "base" / 병합모델 경로
  #   "sft"  → 지식 SFT 어댑터를 이어받아 툴 능력만 추가 (권장)
  #   "base" → 베이스 모델에서 툴 능력만 학습 (지식 SFT와 분리하고 싶을 때)
  init_from: "sft"
  # 데이터에 system 메시지가 없을 때 붙일 기본 system 프롬프트. null이면 미사용.
  # 추론(test_model.py) 때도 같은 값을 써야 함.
  system_prompt: null
  lora:                            # init_from이 경로/base일 때만 새 어댑터 생성에 사용
    r: 32
    alpha: 32
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  train:
    num_epochs: 3                  # 함수 호출 형식 학습은 반복 노출이 효과적
    per_device_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 1.0e-4
    warmup_ratio: 0.05
    lr_scheduler_type: "linear"
    weight_decay: 0.01
    logging_steps: 5
    save_steps: 100
    seed: 42
    # 응답(assistant의 tool_call + 최종 답변)만 loss 계산. tool 결과는 마스킹됨.
    train_on_responses_only: true

# =========================================================
# 계획수립 학습 (선택 단계) — 반드시 docs/planning.md를 먼저 읽으세요
# 목표(goal)를 받아 단계별 계획(steps)을 세우는 능력을 주입하는 전용 단계입니다.
# 데이터 형식: {"goal": "...", "steps": ["1단계", "2단계", ...]} (자동으로 messages로 변환)
# =========================================================
plan:
  output_dir: "outputs/plan"
  # 어디서 시작할지: "sft"(기본) / "cpt" / "base" / 병합모델 경로
  #   "sft"  → 지식 SFT 어댑터를 이어받아 계획 능력만 추가 (권장)
  #   "base" → 베이스 모델에서 계획 능력만 학습 (지식과 분리)
  init_from: "sft"
  # 데이터에 system이 없을 때 붙일 기본 system 프롬프트. null이면 미사용.
  # 예: "너는 목표를 받아 실행 가능한 단계별 계획을 세우는 전문가다."
  system_prompt: null
  lora:                            # init_from이 경로/base일 때만 새 어댑터 생성에 사용
    r: 32
    alpha: 32
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  train:
    num_epochs: 3                  # 계획 형식 학습은 반복 노출이 효과적
    per_device_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 1.0e-4
    warmup_ratio: 0.05
    lr_scheduler_type: "linear"
    weight_decay: 0.01
    logging_steps: 5
    save_steps: 100
    seed: 42
    # 응답(계획)만 loss 계산. 목표(질문) 부분은 마스킹.
    train_on_responses_only: true

# =========================================================
# 선호 학습 (선택 단계) — 반드시 docs/preference_tuning.md를 먼저 읽으세요
# 지식 주입 효과는 없습니다. 환각 억제·형식 교정용입니다.
# 데이터가 부족한 상태로 돌리면 모델이 오히려 나빠집니다.
# =========================================================
preference:
  # ---------- DPO: SFT 뒤에 붙이는 표준 선호 학습 ----------
  dpo:
    output_dir: "outputs/dpo"
    # 어디서 시작할지: "sft" / "cpt" / "base" / 병합모델 경로(예: "outputs/final_model")
    #   "sft"  → SFT 어댑터를 이어서 학습. reference는 베이스 모델이 됨 (간편, VRAM 절약)
    #   경로   → 그 모델 위에 새 LoRA. reference가 정확히 SFT 모델이 됨 (정석)
    # 두 방식의 차이는 docs/preference_tuning.md의 "reference 모델" 절 참고
    init_from: "sft"
    lora:                         # init_from이 경로/base일 때만 사용 (새 어댑터 생성)
      r: 32
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    train:
      beta: 0.1                   # KL 제약 강도. 낮을수록 공격적, 높을수록 보수적 (0.1~0.5)
      num_epochs: 1               # 선호 학습은 1 epoch면 충분한 경우가 많음
      per_device_batch_size: 1    # 한 스텝에 chosen+rejected 둘 다 올라가므로 SFT보다 작게
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-6       # SFT보다 훨씬 낮게. 높이면 쉽게 붕괴함
      warmup_ratio: 0.1
      lr_scheduler_type: "cosine"
      weight_decay: 0.0
      max_length: 2048            # prompt+응답 전체 길이 상한
      max_prompt_length: 1024
      logging_steps: 5
      save_steps: 100
      seed: 42

  # ---------- ORPO: SFT를 대체하는 단일 단계 (reference 모델 불필요) ----------
  orpo:
    output_dir: "outputs/orpo"
    # ORPO는 SFT 역할까지 겸하므로 보통 CPT 어댑터에서 시작
    init_from: "cpt"
    lora:
      r: 32
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    train:
      beta: 0.1                   # ORPO의 lambda(odds ratio 항 가중치)
      num_epochs: 2               # SFT를 겸하므로 DPO보다 많이
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 8.0e-6
      warmup_ratio: 0.1
      lr_scheduler_type: "linear"
      weight_decay: 0.0
      max_length: 2048
      max_prompt_length: 1024
      logging_steps: 5
      save_steps: 100
      seed: 42

  # ---------- KTO: 쌍이 아닌 개별 좋음/나쁨 라벨로 학습 ----------
  kto:
    output_dir: "outputs/kto"
    init_from: "sft"
    lora:
      r: 32
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    train:
      beta: 0.1
      # 좋음/나쁨 샘플 수가 불균형할 때 손실 가중치로 보정
      # 권장: (desirable_weight * n_desirable) / (undesirable_weight * n_undesirable) ≈ 1.0~1.33
      # train_kto.py가 실제 비율을 계산해 경고해 줍니다
      desirable_weight: 1.0
      undesirable_weight: 1.0
      num_epochs: 1
      per_device_batch_size: 2
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-6
      warmup_ratio: 0.1
      lr_scheduler_type: "cosine"
      weight_decay: 0.0
      max_length: 2048
      max_prompt_length: 1024
      logging_steps: 5
      save_steps: 100
      seed: 42

# ---------- 최종 저장 ----------
export:
  # 병합할 어댑터 단계: "sft" / "tool" / "plan" / "dpo" / "orpo" / "kto"
  source_stage: "sft"
  merged_dir: "outputs/final_model"   # LoRA 병합된 16bit 모델
  save_gguf: false                    # true면 GGUF(q4_k_m)도 저장 (llama.cpp/ollama용)
  gguf_quantization: "q4_k_m"
