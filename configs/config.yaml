# =========================================================
# 지식축적형 학습 파이프라인 설정
# CPT (Continued Pretraining) → SFT (Supervised Fine-Tuning)
# =========================================================

# ---------- 베이스 모델 ----------
model:
  # unsloth가 지원하는 아무 모델이나 지정 가능. 예시:
  #   unsloth/Qwen2.5-7B-Instruct-bnb-4bit
  #   unsloth/Llama-3.1-8B-Instruct-bnb-4bit
  #   unsloth/mistral-7b-instruct-v0.3-bnb-4bit
  #   LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct  (unsloth 미리 양자화 버전 없어도 load_in_4bit로 동작)
  name: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"
  max_seq_length: 4096          # VRAM에 맞춰 조정 (24GB → 4096 권장, 부족하면 2048)
  load_in_4bit: true            # 24GB 이하 GPU면 반드시 true (QLoRA)
  dtype: null                   # null이면 자동 감지 (bf16 지원 시 bf16)

  # SFT 단계에서 사용할 채팅 템플릿 (unsloth chat_template 이름)
  # qwen-2.5 / llama-3.1 / chatml / mistral 등
  chat_template: "qwen-2.5"

# ---------- 데이터 경로 ----------
data:
  raw_dir: "data/raw"                          # 원문 문서 (.txt / .md)
  cpt_dataset: "data/processed/cpt_dataset.jsonl"   # CPT용 (text 필드)
  sft_dataset: "data/processed/sft_dataset.jsonl"   # SFT용 (messages 필드, OpenAI 형식)
  # 원문을 청크로 자를 때 설정
  chunk_size: 2000              # 문자 수 기준 청크 크기
  chunk_overlap: 200            # 청크 간 겹침 (문맥 유지)

# ---------- CPT (지식 주입 단계) ----------
cpt:
  output_dir: "outputs/cpt"
  # 지식 주입에는 embed_tokens / lm_head 학습이 중요 (unsloth CPT 권장 설정)
  lora:
    r: 128                      # CPT는 SFT보다 높은 rank 권장 (지식 수용량)
    alpha: 32
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - embed_tokens             # 새 도메인 어휘/지식 흡수에 필수
      - lm_head
  train:
    num_epochs: 3               # 지식축적은 여러 epoch 반복이 효과적
    per_device_batch_size: 2
    gradient_accumulation_steps: 8    # 실효 배치 16
    learning_rate: 5.0e-5
    embedding_learning_rate: 1.0e-5   # embed/lm_head는 10분의 1 수준으로 낮게
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    weight_decay: 0.01
    logging_steps: 5
    save_steps: 100
    seed: 42

# ---------- SFT (지식 활용 단계) ----------
sft:
  output_dir: "outputs/sft"
  # CPT 어댑터를 이어받아 학습. false면 베이스 모델에서 새로 시작
  continue_from_cpt: true
  # 데이터에 system 메시지가 없을 때 자동으로 앞에 붙일 기본 system 프롬프트.
  # null이면 붙이지 않음. 데이터에 이미 system이 있으면 그쪽이 우선.
  # 추론 시에도 같은 값을 쓰는 것이 중요 (test_model.py가 자동으로 사용)
  system_prompt: null
  lora:
    r: 32
    alpha: 32
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  train:
    num_epochs: 2
    per_device_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    warmup_ratio: 0.05
    lr_scheduler_type: "linear"
    weight_decay: 0.01
    logging_steps: 5
    save_steps: 100
    seed: 42
    # 응답 부분만 loss 계산 (질문 부분은 마스킹)
    train_on_responses_only: true

# ---------- 최종 저장 ----------
export:
  merged_dir: "outputs/final_model"   # LoRA 병합된 16bit 모델
  save_gguf: false                    # true면 GGUF(q4_k_m)도 저장 (llama.cpp/ollama용)
  gguf_quantization: "q4_k_m"
